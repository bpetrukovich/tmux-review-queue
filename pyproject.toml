[project]
name = "tmux-review-queue"
version = "0.1.0"
description = "Register AI-reported review tasks as multi-sessionizer groups"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML"]

[project.scripts]
tmux-review-queue = "tmux_review_queue.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["specs"]